version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PORT=8000
    networks:
      - geocongo_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      - API_URL=https://api.analog.geocongoai.com
      - STREAMLIT_SERVER_PORT=8501
    depends_on:
      - api
    networks:
      - geocongo_net

networks:
  geocongo_net:
    driver: bridge
