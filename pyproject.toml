[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analog-finder"
version = "1.0.0"
description = "Decision-support framework identifying terrestrial analogs for permanent lunar bases and Mars"
authors = [{name = "GeoCongo AI"}]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
